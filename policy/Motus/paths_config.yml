# Motus Evaluation Path Configuration
# Paths needed for inference

# ============================================================================
# Core Paths - MUST MODIFY THESE
# ============================================================================
robotwin_root: "/scratch/ows/argus/extern/RoboTwin"     # e.g., "/path/to/RoboTwin"
uv_env: "/scratch/ows/argus/.venv/motus"             # uv virtualenv path

# Pretrained model paths. HF repo ids are supported; Motus resolves only the
# config/tokenizer files plus the WAN VAE/T5 files required by inference.
checkpoint_path: "motus-robotics/Motus_robotwin2"       # local checkpoint dir/file or HF repo id
wan_path: "Wan-AI/Wan2.2-TI2V-5B"
vlm_path: "Qwen/Qwen3-VL-2B-Instruct"

# ============================================================================
# Optional Configuration
# ============================================================================
# GPU IDs (empty means auto-detect)
gpu_ids: []  # e.g., [0, 1, 2, 3, 4, 5, 6, 7]

# Task configuration
task_config: "demo_randomized"
seed: 42
tasks_file: "tasks_all.txt"